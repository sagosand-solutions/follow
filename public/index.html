<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn to read code</title>
<style>
  :root { --bg: #fbf8f3; --fg: #2b2622; --muted: #6f655c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1b19; --fg: #ece6de; --muted: #a59b90; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 1.125rem/1.6 system-ui, sans-serif; padding: 0 16px; }
  main { max-width: 34rem; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Learn to read code, not just write it.</h1>
  <p>An open source platform for learning to read and understand code. Under construction.</p>
</main>
</body>
</html>
