# Dependabot keeps the SHA-pinned CI actions and the two Python requirement
# files current. Weekly and a small open-PR limit: a handful of reviewable
# updates at a time, not a flood. Nothing here runs on its own; every bump is a
# normal pull request that must pass CI and review before it reaches main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /validator
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
