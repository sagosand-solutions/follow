# CI for pull requests and main.
# Runs on GitHub-hosted runners only: this repository is public, so untrusted
# pull requests must never reach a self-hosted runner.
# Question code is validated statically here; it is never executed in CI until
# a hardened sandbox runner exists.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Validator and schema (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            validator/requirements.txt
            server/requirements.txt
      - name: Install validator dependencies
        run: python -m pip install -r validator/requirements.txt -r server/requirements.txt
      - name: Validator tests
        run: python -m unittest discover -s validator/tests -v
      - name: Schema tests
        run: python -m unittest discover -s schema/tests -v
      - name: Server tests (accounts, mock mode)
        run: python -m unittest discover -s server/tests -v
      # The export is the gate for question data: it validates EVERY public question against the vocabulary of its own
      # course (the same validate_question the CLI uses, plus filename, licence, duplicate, orphan and prefix rules) and
      # checks that the derived files are up to date. A single-vocabulary line over all questions cannot work for several courses.
      # Public CI uses SYNTHETIC data only: this proves the static exposure check works and fails closed (no database, bound
      # or unbound underlay, empty or tampered underlay, protected id or hash in a public tree, exposure gaps). The real release
      # check runs in the private release pipeline against the authoritative pool and the digest of the release decision.
      - name: Static exposure check and release gate self-tests (synthetic pool only)
        run: python -m unittest server.tests.test_pool_underlay server.tests.test_pool_release server.tests.test_pool_artifact -v
      - name: Course data is valid and exported files are up to date (static only)
        run: python -m validator export --check
      - name: Traces match question code (static, nothing executed)
        run: python -m validator trace --check
      # Informative only: prints a coverage report so a trend is visible. It never
      # fails the build and has no threshold; the test steps above are the gate.
      # One leg only: coverage re-runs all three suites, and the 3.11 interpreter
      # traces with sys.settrace (2-4x slower), which could approach the job
      # timeout; 3.14 uses sys.monitoring and stays cheap.
      - name: Coverage report (informative, no threshold, 3.14 leg only)
        if: matrix.python == '3.14'
        continue-on-error: true
        run: |
          python -m pip install coverage==7.16.2
          coverage run -m unittest discover -s validator/tests
          coverage run -a -m unittest discover -s schema/tests
          coverage run -a -m unittest discover -s server/tests
          coverage report -m

  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Web tests
        run: |
          # A glob, not a directory: Node 24 treats a directory argument as a module path.
          node --test 'web-tests/*.test.mjs'
      # Informative only: prints Node's built-in coverage so a trend is visible. It
      # never fails the build and has no threshold; the web test step above is the gate.
      - name: Web test coverage report (informative, no threshold)
        continue-on-error: true
        run: node --test --experimental-test-coverage 'web-tests/*.test.mjs'
